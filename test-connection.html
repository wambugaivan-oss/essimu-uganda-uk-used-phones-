<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supabase Connection Test</title>
<style>
  body{font-family:sans-serif;background:#111;color:#eee;padding:24px;}
  #status{font-size:1.2rem;margin-bottom:16px;}
  .ok{color:#22c55e;} .fail{color:#ef4444;}
  pre{background:#1e1e24;padding:16px;border-radius:8px;overflow:auto;}
</style>
</head>
<body>
<h1>Supabase Connection Test</h1>
<div id="status">Connecting…</div>
<pre id="result"></pre>

<script type="module">
  import { fetchProducts } from './assets/js/supabase.js';

  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');

  fetchProducts().then(products => {
    if (products.length > 0) {
      statusEl.textContent = `✅ Connected. Found ${products.length} active product(s).`;
      statusEl.className = 'ok';
    } else {
      statusEl.textContent = '⚠️ Connected, but 0 products returned. Check your test rows are marked active = true.';
    }
    resultEl.textContent = JSON.stringify(products, null, 2);
  }).catch(err => {
    statusEl.textContent = '❌ Connection failed — see console/error below.';
    statusEl.className = 'fail';
    resultEl.textContent = String(err);
  });
</script>
</body>
</html>
